version: 2

models:
  - name: silver_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: date_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_date')
                field: date_sk
      - name: store_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_store')
                field: store_sk
      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_product')
                field: product_sk
      - name: customer_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_customer')
                field: customer_sk
      - name: promotion_sk
      - name: quantity
        data_tests:
          - non_negative
      - name: unit_price
        data_tests:
          - non_negative
      - name: gross_amount
        data_tests:
          - non_negative
      - name: discount_amount
        data_tests:
          - non_negative
      - name: net_amount
        data_tests:
          - non_negative

  - name: silver_returns
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_sales')
                field: sales_id
      - name: date_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_date')
                field: date_sk
      - name: store_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_store')
                field: store_sk
      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_product')
                field: product_sk
      - name: returned_qty
        data_tests:
          - non_negative
      - name: return_reason
      - name: refund_amount
        data_tests:
          - non_negative

  - name: silver_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null

  - name: silver_product
    columns:
      - name: product_sk
        data_tests:
          - unique
          - not_null
      - name: list_price
        data_tests:
          - non_negative

  - name: silver_date
    columns:
      - name: date_sk
        data_tests:
          - unique
          - not_null

  - name: silver_customer
    columns:
      - name: customer_sk
        data_tests:
          - unique
          - not_null
      - name: customer_code
        data_tests:
          - not_null